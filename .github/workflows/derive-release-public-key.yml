name: Derive release public key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - name: Derive the public verification key
        env:
          RELEASE_KEY: ${{ secrets.HORIZON_REVO_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY"
          printf '%s' "$RELEASE_KEY" | base64 --decode > private.der
          openssl pkey -inform DER -in private.der -pubout -outform DER > public.der
          printf 'Release verification key: '
          tail -c 32 public.der | base64 --wrap=0
          printf '\n'
