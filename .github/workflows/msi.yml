name: Build Horizon Revo MSI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-revo-msi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_TELEMETRY_URL: off
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_ELY_TOKEN_BROKER: ${{ vars.HORIZON_ELY_TOKEN_BROKER }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: horizon-revo-msi
      - name: Build launcher
        run: |
          test -n "$HORIZON_ELY_TOKEN_BROKER"
          cargo build --manifest-path launcher/Cargo.toml --release --locked --bin horizon-launcher
      - name: Install WiX Toolset
        run: dotnet tool install --tool-path "$RUNNER_TEMP/wix" wix --version 5.0.2
      - name: Build MSI
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          wix="${RUNNER_TEMP//\\//}/wix/wix.exe"
          workspace="${GITHUB_WORKSPACE//\\//}"
          mkdir -p dist
          "$wix" build packaging/windows/horizon-revo.wxs \
            -arch x64 \
            -d "LauncherExe=$workspace/launcher/target/release/horizon-launcher.exe" \
            -d "ProductVersion=$version" \
            -o "dist/horizon-launcher-setup-x64.msi"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: package
      - name: Publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="horizon-revo-v${{ steps.package.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/horizon-launcher-setup-x64.msi --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/horizon-launcher-setup-x64.msi \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Horizon Revo ${{ steps.package.outputs.version }}" \
              --notes "Windows x64 installer for Horizon Revo. Run the MSI to install per-user without administrator permissions."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-revo-msi
          path: dist/horizon-launcher-setup-x64.msi
          if-no-files-found: error
          retention-days: 30
