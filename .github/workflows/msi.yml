name: Build Horizon Revo Windows installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-revo-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_TELEMETRY_URL: off
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_ELY_TOKEN_BROKER: ${{ vars.HORIZON_ELY_TOKEN_BROKER }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: horizon-revo-msi
      - name: Build launcher
        run: |
          test -n "$HORIZON_ELY_TOKEN_BROKER"
          cargo build --manifest-path launcher/Cargo.toml --release --locked --bin horizon-launcher
      - name: Install WiX Toolset
        run: dotnet tool install --tool-path "$RUNNER_TEMP/wix" wix --version 5.0.2
      - name: Build installers and portable archive
        id: package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          wix="${RUNNER_TEMP//\\//}/wix/wix.exe"
          workspace="${GITHUB_WORKSPACE//\\//}"
          mkdir -p dist/portable launcher-update
          "$wix" extension add WixToolset.BootstrapperApplications.wixext/5.0.2
          "$wix" build packaging/windows/horizon-revo.wxs \
            -arch x64 \
            -d "LauncherExe=$workspace/launcher/target/release/horizon-launcher.exe" \
            -d "ProductVersion=$version" \
            -o "dist/horizon-launcher-setup-x64.msi"
          "$wix" build packaging/windows/horizon-revo-bundle.wxs \
            -arch x64 \
            -d "MsiPath=$workspace/dist/horizon-launcher-setup-x64.msi" \
            -d "ProductVersion=$version" \
            -ext WixToolset.BootstrapperApplications.wixext \
            -o "dist/horizon-revo-setup-x64.exe"
          cp launcher/target/release/horizon-launcher.exe launcher-update/horizon-launcher.exe
          powershell.exe -NoProfile -Command "Compress-Archive -Path 'launcher-update/*' -DestinationPath 'dist/horizon-launcher-windows-x64.zip' -CompressionLevel Optimal"
          cp launcher/target/release/horizon-launcher.exe dist/portable/horizon-launcher.exe
          cp packaging/windows/portable-launch.cmd "dist/portable/Horizon Revo Portable.cmd"
          cp packaging/windows/portable-README.txt dist/portable/README.txt
          powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/portable/*' -DestinationPath 'dist/horizon-revo-portable-windows-x64.zip' -CompressionLevel Optimal"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-revo-windows-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: horizon-revo-windows-unsigned
          path: dist
      - name: Sign release checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.HORIZON_REVO_RELEASE_SIGNING_KEY }}
          TAG: launcher@${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          tools/ci/sign_release.sh "$TAG" \
            dist/horizon-launcher-windows-x64.zip \
            dist/horizon-revo-setup-x64.exe \
            dist/horizon-launcher-setup-x64.msi \
            dist/horizon-revo-portable-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-revo-windows-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: horizon-revo-windows-signed
          path: dist
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="launcher@$VERSION"
          notes="Windows x64 downloads for Horizon Revo. Setup EXE and MSI installers install per-user. The portable ZIP keeps launcher and game data beside itself. Signed launcher updates preserve Ely.by sign-in and guest play."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/horizon-launcher-windows-x64.zip dist/horizon-launcher-setup-x64.msi dist/horizon-revo-setup-x64.exe dist/horizon-revo-portable-windows-x64.zip dist/SHA256SUMS dist/SHA256SUMS.sig --clobber
            gh release edit "$tag" --title "Horizon Revo $VERSION" --notes "$notes"
          else
            gh release create "$tag" dist/horizon-launcher-windows-x64.zip dist/horizon-launcher-setup-x64.msi dist/horizon-revo-setup-x64.exe dist/horizon-revo-portable-windows-x64.zip dist/SHA256SUMS dist/SHA256SUMS.sig \
              --target "$GITHUB_SHA" \
              --title "Horizon Revo $VERSION" \
              --notes "$notes"
          fi
