name: Build Ely enabled game

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ely-game-windows-x64
      - name: Validate the release version
        id: version
        run: |
          version="$(date -u +%Y.%m.%d)-elyby.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the Windows game programs
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          HORIZON_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "HORIZON_VERSION=$HORIZON_VERSION" >> "$GITHUB_ENV"
          cargo build --release --locked -p horizon-client -p horizon-client-lib --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: Check the built programs
        env:
          HORIZON_VERSION: ${{ steps.version.outputs.version }}
        run: |
          target/release/horizon-client.exe --help | grep -q -- '--resources'
          target/release/horizon-ctl.exe --help > /dev/null
          target/release/horizon-prepare.exe --help | grep -q -- '--minecraft-dir'
          [[ "$(target/release/horizon-server.exe --version)" == "horizon-server $HORIZON_VERSION" ]]
      - name: Fetch the upstream exporter bundle
        run: |
          mkdir -p upstream
          gh release download nightly --repo horizon-rust/horizon --pattern horizon-windows-x64.zip --dir upstream
          gh release download nightly --repo horizon-rust/horizon --pattern SHA256SUMS --dir upstream
          expected=$(grep 'horizon-windows-x64.zip$' upstream/SHA256SUMS | awk '{print $1}')
          actual=$(sha256sum upstream/horizon-windows-x64.zip | awk '{print $1}')
          test -n "$expected" && test "$actual" = "$expected"
          unzip -q upstream/horizon-windows-x64.zip 'horizon-windows-x64/exporters/*'
          cp -R horizon-windows-x64/exporters exporters
      - name: Package the game release
        run: |
          cargo run --locked -p xtask -- package target/release/horizon-client.exe dist/horizon-windows-x64
          7z a -tzip dist/horizon-windows-x64.zip dist/horizon-windows-x64 > /dev/null
          test -s dist/horizon-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ely-game-windows-unsigned
          path: dist/horizon-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ely-game-windows-unsigned
          path: dist
      - name: Sign the game archive
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.HORIZON_REVO_RELEASE_SIGNING_KEY }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          bash tools/ci/sign_release.sh "$TAG" dist/horizon-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ely-game-windows-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ely-game-windows-signed
          path: dist
      - name: Publish the signed game archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="Windows x64 game client with native Ely.by session authentication and skin support."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/horizon-windows-x64.zip dist/SHA256SUMS dist/SHA256SUMS.sig --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "Horizon Revo Game $VERSION" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/horizon-windows-x64.zip dist/SHA256SUMS dist/SHA256SUMS.sig \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Horizon Revo Game $VERSION" \
              --notes "$notes"
          fi
