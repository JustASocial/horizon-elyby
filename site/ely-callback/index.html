<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Horizon Revo sign-in</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Segoe UI, Arial, sans-serif;
      background: #191919;
      color: #f2f2f2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 440px);
      padding: 32px;
      border: 1px solid #323232;
      border-radius: 16px;
      background: #1f1f1f;
    }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
    p { margin: 0; color: #c2c2c2; line-height: 1.55; }
    #status { margin-top: 16px; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 16px;
      border-radius: 8px;
      background: #323232;
      color: #fff;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #d0d0d0; outline-offset: 3px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Horizon Revo sign-in</h1>
    <p id="message">Returning the sign-in result to the app.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="retry" href="#" hidden>Try again</a>
  </main>
  <script>
    const query = new URLSearchParams(window.location.search);
    const message = document.getElementById("message");
    const status = document.getElementById("status");
    const retry = document.getElementById("retry");
    const state = query.get("state") || "";
    const match = /^horizon-revo-ely:(\d{5}):(\w{32,128})$/.exec(state);
    const port = match ? Number(match[1]) : 0;
    const code = query.get("code") || "";
    const error = query.get("error");

    if (!match || port < 49152 || port > 65535) {
      message.textContent = "This sign-in request could not be verified. Return to the app and start again.";
      status.textContent = "";
    } else if ((!error && !code) || code.length > 4096) {
      message.textContent = "Sign-in did not finish. Return to the app and try again.";
      status.textContent = "";
    } else {
      const callback = new URL(`http://127.0.0.1:${port}/oauth/ely/callback`);
      callback.searchParams.set("state", state);
      if (error) callback.searchParams.set("error", error);
      else callback.searchParams.set("code", code);
      retry.href = callback.href;
      retry.hidden = false;
      fetch(callback, { method: "GET", mode: "cors", credentials: "omit", cache: "no-store" })
        .then(async response => {
          const detail = await response.text();
          if (!response.ok) throw new Error(detail || "The app rejected the sign-in response.");
          message.textContent = "Sign-in complete. You can close this tab.";
          status.textContent = "Return to Horizon Revo.";
          retry.hidden = true;
        })
        .catch(error => {
          message.textContent = error.message || "The app could not be reached. Make sure Horizon Revo is open, then try again.";
          status.textContent = "Return to Horizon Revo and check the sign-in message.";
        });
    }
  </script>
</body>
</html>
